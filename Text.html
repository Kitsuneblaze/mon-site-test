<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Text Chat</title>
<link rel="stylesheet" href="style.css">
<style>
body, html {
    margin: 0;
    padding: 0;
    height: 100%;
    font-family: Arial, sans-serif;
    background: black;
    color: gold;
    overflow: hidden;
}

/* Particules */
.particle {
    position: absolute;
    border-radius: 50%;
}

/* Contenu central */
.main-content {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 90%;
    max-width: 500px;
    text-align: center;
}

/* Zone chat */
#chatBox {
    width: 100%;
    height: 300px;
    background: rgba(0,0,0,0.3);
    border: 2px solid gold;
    border-radius: 10px;
    overflow-y: auto;
    padding: 10px;
    margin-bottom: 10px;
    color: white;
}

/* Message individuel */
.message {
    margin-bottom: 8px;
}

/* Indicateur écriture */
#typingIndicator {
    font-size: 14px;
    color: gold;
    height: 18px;
    margin-bottom: 5px;
}

/* Input */
#chatInput {
    width: 100%;
    padding: 10px;
    border-radius: 8px;
    border: 2px solid gold;
    background: rgba(0,0,0,0.3);
    color: white;
    font-size: 16px;
}

/* Bouton envoyer */
#sendBtn {
    margin-top: 10px;
    padding: 10px 20px;
    border-radius: 8px;
    border: 2px solid gold;
    background: rgba(0,0,0,0.3);
    color: gold;
    font-weight: bold;
    cursor: pointer;
    transition: 0.3s;
}
#sendBtn:hover {
    background: gold;
    color: black;
}

/* Petit point notification */
#notificationBell {
    position: fixed;
    top: 20px;
    right: 20px;
    width: 12px;
    height: 12px;
    background: gold;
    border-radius: 50%;
    display: none;
    cursor: pointer;
}
</style>
</head>
<body>
<div id="particles-container"></div>

<div class="main-content">
    <h1>Text Chat</h1>
    <div id="chatBox"></div>
    <div id="typingIndicator"></div>
    <input type="text" id="chatInput" placeholder="Écris ton message ici...">
    <button id="sendBtn">Envoyer</button>
</div>

<div id="notificationBell"></div>

<script>
// Particules animées
const container = document.getElementById("particles-container");
const particlesCount = 80;
const particles = [];
for (let i = 0; i < particlesCount; i++) {
    const particle = document.createElement("div");
    particle.classList.add("particle");
    const size = Math.random() * 5 + 2;
    particle.style.width = size + "px";
    particle.style.height = size + "px";
    particle.style.background = `rgba(${200 + Math.random()*55}, ${50 + Math.random()*50}, 0, ${0.3 + Math.random()*0.7})`;
    particle.style.left = Math.random() * window.innerWidth + "px";
    particle.style.top = Math.random() * window.innerHeight + "px";
    const speedX = (Math.random() - 0.5) * 2;
    const speedY = (Math.random() - 0.5) * 2;
    container.appendChild(particle);
    particles.push({ element: particle, speedX, speedY });
}
function moveParticles() {
    particles.forEach(p => {
        let top = parseFloat(p.element.style.top);
        let left = parseFloat(p.element.style.left);
        top += p.speedY;
        left += p.speedX;
        if (top < 0) top = window.innerHeight;
        if (top > window.innerHeight) top = 0;
        if (left < 0) left = window.innerWidth;
        if (left > window.innerWidth) left = 0;
        p.element.style.top = top + "px";
        p.element.style.left = left + "px";
    });
    requestAnimationFrame(moveParticles);
}
moveParticles();

// Chat
const chatBox = document.getElementById("chatBox");
const input = document.getElementById("chatInput");
const sendBtn = document.getElementById("sendBtn");
const notificationBell = document.getElementById("notificationBell");
const typingIndicator = document.getElementById("typingIndicator");

let isActive = true; // utilisateur sur la page
let otherTyping = false;

// Focus / blur
window.addEventListener("blur", () => { isActive = false; });
window.addEventListener("focus", () => { 
    isActive = true; 
    notificationBell.style.display = "none"; 
});

// Ajouter un message
function addMessage(msg) {
    const div = document.createElement("div");
    div.classList.add("message");
    div.textContent = msg;
    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
}

// Simuler message de l'autre personne
function simulateIncomingMessage(msg) {
    if (isActive) {
        addMessage("Ami : " + msg);
        typingIndicator.textContent = "";
    } else {
        notificationBell.style.display = "block"; // point notification visible
    }
}

// Simuler l'autre qui écrit
function simulateTyping() {
    otherTyping = true;
    typingIndicator.textContent = "Ami est en train d'écrire...";
    setTimeout(() => {
        simulateIncomingMessage("Réponse automatique");
        otherTyping = false;
    }, 2000 + Math.random()*2000);
}

// Envoyer message
sendBtn.addEventListener("click", () => {
    if (input.value.trim() !== "") {
        addMessage("Moi : " + input.value);
        input.value = "";
        simulateTyping();
    }
});

input.addEventListener("keypress", (e) => {
    if (e.key === "Enter") sendBtn.click();
});

// Cliquer sur le point notification → focus
notificationBell.addEventListener("click", () => {
    window.focus();
    notificationBell.style.display = "none";
});

// Simuler messages aléatoires toutes les 10-15s
setInterval(() => {
    if (!otherTyping) simulateTyping();
}, 10000 + Math.random()*5000);
</script>
</body>
</html>
