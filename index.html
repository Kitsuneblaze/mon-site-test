<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Bienvenue L'Élite</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            height: 100vh;
            background: linear-gradient(135deg, #000000, #1a1400, #000000);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            color: #f5d76e;
        }

        .elite-container {
            text-align: center;
            padding: 50px 70px;
            border: 2px solid #f5d76e;
            border-radius: 12px;
            background: rgba(0, 0, 0, 0.7);
            box-shadow: 0 0 40px rgba(245, 215, 110, 0.25);
            animation: fadeIn 1.5s ease;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 15px;
            letter-spacing: 2px;
        }

        p {
            font-size: 18px;
            margin-bottom: 35px;
            color: #ddd;
        }

        .elite-btn {
            text-decoration: none;
            padding: 15px 35px;
            font-size: 18px;
            color: #000;
            background: #f5d76e;
            border-radius: 8px;
            font-weight: bold;
            transition: 0.3s ease;
        }

        .elite-btn:hover {
            background: #fff1a8;
            box-shadow: 0 0 25px #f5d76e;
            transform: scale(1.05);
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>

    <div class="elite-container">
        <h1>Bienvenue dans L’Élite</h1>
        <p>Accès réservé aux vrais membres.</p>

        <a class="elite-btn"
           href="https://xkitsuneblazex1.wixsite.com/super-gamer-communit"
           target="_blank">
           Entrer dans la communauté
        </a>
    </div>

</body>
</html>
