<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bienvenue sur l’Élite</title>

  <style>
    /* === RESET === */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Segoe UI", sans-serif;
    }

    body {
      min-height: 100vh;
      color: white;
      overflow-x: hidden;
    }

    /* === BACKGROUND OR & NOIR ANIMÉ === */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 20% 30%, rgba(212,175,55,0.25), transparent 40%),
        radial-gradient(circle at 80% 70%, rgba(212,175,55,0.15), transparent 45%),
        linear-gradient(120deg, #000000, #0b0b0b, #1a1405);
      background-size: 200% 200%;
      animation: goldFlow 18s ease-in-out infinite;
      z-index: -2;
    }

    @keyframes goldFlow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* === PARTICULES NETHER === */
    .particles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: -1;
    }

    .particle {
      position: absolute;
      bottom: -10px;
      width: 3px;
      height: 3px;
      background: rgba(212,175,55,0.8);
      box-shadow: 0 0 6px rgba(212,175,55,0.8);
      animation: rise linear infinite;
      opacity: 0.8;
    }

    .particle.dark {
      background: rgba(0,0,0,0.9);
      box-shadow: 0 0 6px rgba(0,0,0,0.9);
    }

    @keyframes rise {
      from {
        transform: translateY(0) scale(1);
        opacity: 0;
      }
      20% { opacity: 0.8; }
      to {
        transform: translateY(-110vh) scale(0.3);
        opacity: 0;
      }
    }

    /* === HERO === */
    .hero {
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 2rem;
    }

    /* TITRE PRINCIPAL */
    .hero h1 {
      font-size: clamp(2.5rem, 5vw, 4rem);
      background: linear-gradient(90deg, #f5d76e, #d4af37, #f5d76e);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: goldText 6s linear infinite, glowPulse 4s ease-in-out infinite;
      margin-bottom: 0.6rem;
    }

    @keyframes goldText {
      0% { background-position: 0% center; }
      100% { background-position: 200% center; }
    }

    @keyframes glowPulse {
      0%, 100% {
        text-shadow: 0 0 10px rgba(212,175,55,0.3);
      }
      50% {
        text-shadow: 0 0 25px rgba(212,175,55,0.7);
      }
    }

    /* SOUS-TEXTE ANGLAIS */
    .hero-sub {
      font-size: 0.95rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      opacity: 0.75;
      animation: fadeSlide 2.5s ease forwards;
    }

    @keyframes fadeSlide {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 0.75;
        transform: translateY(0);
      }
    }

    /* === LIEN ANIMÉ === */
    .hero-link {
      margin-top: 1.2rem;
      font-size: 0.9rem;
      color: #d4af37;
      text-decoration: none;
      letter-spacing: 0.08em;
      position: relative;
      transition: all 0.3s ease;
    }

    .hero-link::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: -4px;
      width: 0%;
      height: 2px;
      background: linear-gradient(90deg, #d4af37, #f5d76e);
      transition: width 0.4s ease;
    }

    .hero-link:hover {
      color: #f5d76e;
      text-shadow: 0 0 12px rgba(212,175,55,0.6);
    }

    .hero-link:hover::after {
      width: 100%;
    }
  </style>
</head>
<body>

  <!-- PARTICULES -->
  <div class="particles">
    <span class="particle" style="left:5%; animation-duration:14s;"></span>
    <span class="particle dark" style="left:15%; animation-duration:18s;"></span>
    <span class="particle" style="left:30%; animation-duration:12s;"></span>
    <span class="particle dark" style="left:45%; animation-duration:20s;"></span>
    <span class="particle" style="left:60%; animation-duration:16s;"></span>
    <span class="particle dark" style="left:75%; animation-duration:22s;"></span>
    <span class="particle" style="left:90%; animation-duration:15s;"></span>
  </div>

  <!-- HERO -->
  <section class="hero">
    <h1>Bienvenue sur l’Élite</h1>
    <small class="hero-sub">Welcome to the Elite</small>

    <a
      href="https://kitsuneblaze.github.io/mon-site-test/"
      class="hero-link"
      target="_blank">
      https://kitsuneblaze.github.io/mon-site-test/
    </a>
  </section>

</body>
</html>
